<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM248B 水耕農場配置系統 - 互動分解圖面</title>
    <style>
        :root {
            --bg-color: #0b111e;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #00f3ff;
            --primary-glow: rgba(0, 243, 255, 0.3);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
        }

        header {
            background: rgba(11, 17, 30, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-title p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-glow);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn-accent {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .btn-accent:hover {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1200px) {
            .workspace-grid {
                grid-template-columns: 7fr 3fr;
            }
        }

        /* 互動圖面區 */
        .diagram-container-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .diagram-container {
            position: relative;
            width: 100%;
            max-width: 2816px;
            aspect-ratio: 2816 / 1536;
            background-image: url('images/am248b-hydroponics-layout.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* 覆蓋熱區 */
        .hotspot-overlay {
            position: absolute;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            z-index: 5;
        }

        .hotspot-overlay:hover, .hotspot-overlay.active {
            border-color: var(--primary);
            background-color: rgba(0, 243, 255, 0.12);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        /* 脈衝指示點 */
        .pulse-dot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 0 10px var(--primary);
            transition: all 0.3s ease;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            opacity: 0.8;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.3); opacity: 0.8; }
            80%, 100% { transform: scale(1.8); opacity: 0; }
        }

        .hotspot-overlay:hover ~ .pulse-dot,
        .hotspot-overlay.active ~ .pulse-dot {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }
        .hotspot-overlay:hover ~ .pulse-dot::after,
        .hotspot-overlay.active ~ .pulse-dot::after {
            border-color: var(--accent);
        }

        /* 右側詳細資料面板 */
        .details-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            min-height: 400px;
        }

        .panel-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            padding: 3rem 1rem;
            border: 2px dashed rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .panel-placeholder svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1.5rem;
            stroke: var(--text-muted);
            opacity: 0.6;
        }

        .panel-placeholder h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .panel-content {
            display: none;
            flex-direction: column;
            gap: 1.2rem;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-header {
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.8rem;
        }

        .panel-title-zh {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.2rem;
        }

        .panel-title-en {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .panel-crop-wrapper {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        .panel-crop-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            transition: transform 0.3s ease;
        }

        .panel-crop-wrapper:hover .panel-crop-img {
            transform: scale(1.05);
        }

        .panel-section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .text-extracted-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 0.8rem;
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #a7f3d0;
            white-space: pre-line;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: var(--accent-glow);
            color: var(--accent);
            border-color: var(--accent);
        }

        .panel-desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #d1d5db;
        }

        /* 分解列表畫廊 */
        .gallery-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .gallery-section h2 {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--accent);
            padding-left: 0.8rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .gallery-item {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0, 243, 255, 0.1);
        }

        .gallery-img-wrapper {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .gallery-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .gallery-info h4 {
            font-size: 1.05rem;
            color: var(--text-main);
            margin-bottom: 0.2rem;
        }

        .gallery-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--card-border);
            background: rgba(11, 17, 30, 0.9);
            margin-top: auto;
        }

        .diagram-footer-tips {
            text-align: center;
            font-size: 0.9rem;
            color: var(--primary);
            margin-top: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

        // 點選元件展示詳細資料
        function selectComponent(key) {
            // 清除現有的 active 狀態
            document.querySelectorAll('.hotspot-overlay').forEach(el => el.classList.remove('active'));
            
            // 啟用當前熱區 active 狀態
            const hotspot = document.getElementById('hs-' + key);
            if (hotspot) hotspot.classList.add('active');

            const data = componentsData[key];
            if (!data) return;

            // 隱藏 placeholder，顯示內容
            document.getElementById('panelPlaceholder').style.display = 'none';
            const content = document.getElementById('panelContent');
            content.style.display = 'flex';

            // 更新內容
            document.getElementById('panelTitleZh').innerText = data.title_zh;
            document.getElementById('panelTitleEn').innerText = data.title_en;
            document.getElementById('panelCropImg').src = data.image;
            document.getElementById('panelCropImg').alt = data.title_zh;
            document.getElementById('panelExtractedText').innerText = data.text_extracted;
            document.getElementById('panelDesc').innerText = data.desc;

            // 更新下載按鈕
            const dlBtn = document.getElementById('downloadBtn');
            dlBtn.href = data.image;
            dlBtn.download = data.image.split('/').pop();
            
            // 平滑滾動到面板 (如果在手機/窄螢幕上)
            if (window.innerWidth < 1200) {
                document.getElementById('detailsPanel').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // 複製提取文字
        function copyExtractedText() {
            const text = document.getElementById('panelExtractedText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const copyBtn = document.querySelector('.copy-btn');
                copyBtn.innerText = '已複製！';
                copyBtn.style.background = 'rgba(16, 185, 129, 0.2)';
                copyBtn.style.color = '#10b981';
                setTimeout(() => {
                    copyBtn.innerText = '複製文字';
                    copyBtn.style.background = '';
                    copyBtn.style.color = '';
                }, 2000);
            }).catch(err => {
                console.error('複製失敗: ', err);
            });
        }

        // 初始化下方的全部元件圖庫
        function initGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            for (const [key, data] of Object.entries(componentsData)) {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => {
                    selectComponent(key);
                    document.getElementById('diagramContainer').scrollIntoView({ behavior: 'smooth' });
                };

                // 將提取文字整理為單行簡介
                const cleanText = data.text_extracted.replace(/\n/g, ' | ');

                item.innerHTML = `
                    <div class="gallery-img-wrapper">
                        <img src="${data.image}" alt="${data.title_zh}">
                    </div>
                    <div class="gallery-info">
                        <h4>${data.title_zh}</h4>
                        <p style="color: var(--primary); font-size: 0.8rem; margin-bottom: 0.3rem;">${data.title_en}</p>
                        <p style="overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3;">
                            ${cleanText}
                        </p>
                    </div>
                `;
                grid.appendChild(item);
            }
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            initGallery();
        });
    </script>
<script>
document.addEventListener('keydown', (e) => {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
        window.parent.postMessage('keydown-next', '*');
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        window.parent.postMessage('keydown-prev', '*');
    }
});
</script>
